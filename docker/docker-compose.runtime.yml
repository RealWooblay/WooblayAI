# ─────────────────────────────────────────────────────────────────────────────
# Wooblay Runtime – Production Compose for EC2 Deployment
#
# Runs on a hardened EC2 instance in a private subnet.
# Three containers on an isolated Docker bridge network:
#   1. postgres  – Tenant-isolated database (encrypted EBS)
#   2. gate      – Wooblay Gate (policy, approvals, receipts, UI)
#   3. agent     – Agent runtime (OpenClaw, etc.) - network-restricted
#
# The agent container can ONLY reach the gate container on port 4800.
# iptables rules (applied by userdata) enforce this at the host level.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: wooblay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:-wooblay}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME:-wooblay}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wooblay}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      gate_net:
        ipv4_address: 172.20.0.10
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Wooblay Gate ───────────────────────────────────────────────────────
  gate:
    image: "${GATE_IMAGE}"
    container_name: wooblay-gate
    restart: unless-stopped
    ports:
      - "4800:4800"
    volumes:
      # Docker socket — allows Gate to manage agent containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host .env — so Gate can update runtime config that compose reads
      - /opt/wooblay/.env:/opt/wooblay/.env
      # Instances dir — per-instance compose + env files on host
      - /opt/wooblay/instances:/opt/wooblay/instances
      # Compose file — so Gate knows where the main compose is
      - /opt/wooblay/docker-compose.yml:/opt/wooblay/docker-compose.yml:ro
    environment:
      NODE_ENV: production
      PORT: "4800"
      DATABASE_URL: "postgresql://${DB_USER:-wooblay}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-wooblay}"
      WOOBLAY_SERVER_PRIVATE_KEY: "${WOOBLAY_SERVER_PRIVATE_KEY}"
      WOOBLAY_SERVER_PUBLIC_KEY: "${WOOBLAY_SERVER_PUBLIC_KEY}"
      # Chat proxy needs to reach the agent's Gateway WS
      OPENCLAW_GATEWAY_WS: "ws://172.21.0.30:18789"
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN:-}"
      # Instance management paths (host-mapped)
      RUNTIME_ENV_FILE: "/opt/wooblay/.env"
      COMPOSE_FILE: "/opt/wooblay/docker-compose.yml"
      INSTANCES_DIR: "/opt/wooblay/instances"
      # ECR image for spawning new agent instances
      AGENT_IMAGE: "${AGENT_IMAGE}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4800/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      gate_net:
        ipv4_address: 172.20.0.20
      agent_net:
        ipv4_address: 172.21.0.20
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Agent Runtime ──────────────────────────────────────────────────────
  agent:
    image: "${AGENT_IMAGE}"
    container_name: wooblay-agent
    restart: unless-stopped
    environment:
      GATE_URL: "http://172.21.0.20:4800"
      WOOBLAY_TOOL_FILTER: "${WOOBLAY_TOOL_FILTER:-risky}"
      WOOBLAY_SIGNING_KEY_PATH: "/root/.wooblay/keys"
      WOOBLAY_AGENT_KEY_NAME: "wooblay-agent"
      # Shared gateway token (set in .env, or auto-generated by agent if empty)
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN:-}"
      # Channel configuration
      TELEGRAM_ENABLED: "${TELEGRAM_ENABLED:-false}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ALLOWED_USERS: "${TELEGRAM_ALLOWED_USERS:-}"
      # Agent model configuration
      OPENCLAW_MODEL: "${OPENCLAW_MODEL:-claude-sonnet-4-20250514}"
      OPENCLAW_AGENTS_JSON: "${OPENCLAW_AGENTS_JSON:-}"
      # Anthropic API key (passed through to OpenClaw)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on:
      gate:
        condition: service_healthy
    # Security: non-root, no new privileges, drop all capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256M
    networks:
      agent_net:
        ipv4_address: 172.21.0.30
    dns:
      - 8.8.8.8
    deploy:
      resources:
        limits:
          memory: 1536M

# ── Networks ─────────────────────────────────────────────────────────────
# Two separate bridge networks:
#   gate_net: postgres <-> gate (agent cannot reach this)
#   agent_net: gate <-> agent (agent can only reach gate on 4800)
networks:
  gate_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  agent_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

volumes:
  pg_data:
    driver: local
