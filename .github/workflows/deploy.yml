name: Build & Deploy

on:
  push:
    branches: [mvp, main]
  workflow_dispatch: # Manual trigger — run from Actions tab if you pushed to another branch

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 050752647977.dkr.ecr.us-east-1.amazonaws.com
  GATE_REPO: wooblay-gate
  AGENT_REPO: openclaw-wooblay
  MCP_PROXY_REPO: wooblay-mcp-proxy
  MCP_EXECUTOR_REPO: wooblay-mcp-executor
  INSTANCE_ID: i-018d018e8e511b4b0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        run: |
          for repo in ${{ env.GATE_REPO }} ${{ env.AGENT_REPO }} ${{ env.MCP_PROXY_REPO }} ${{ env.MCP_EXECUTOR_REPO }}; do
            aws ecr describe-repositories --repository-names "$repo" --region ${{ env.AWS_REGION }} 2>/dev/null || \
            aws ecr create-repository --repository-name "$repo" --region ${{ env.AWS_REGION }}
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Gate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gate/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.GATE_REPO }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.GATE_REPO }}:mvp
            ${{ env.ECR_REGISTRY }}/${{ env.GATE_REPO }}:latest
          build-args: |
            VITE_CLERK_PK=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check if agent files changed
        id: agent-changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- \
            docker/runtimes/openclaw/ \
            packages/adapters/openclaw/ \
            2>/dev/null || echo "first-run")
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Agent files changed — will rebuild agent image"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No agent file changes — skipping agent build"
          fi

      - name: Build and push Agent image
        if: steps.agent-changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runtimes/openclaw/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.AGENT_REPO }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.AGENT_REPO }}:latest
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Build and push MCP Proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runtimes/mcp-proxy/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.MCP_PROXY_REPO }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.MCP_PROXY_REPO }}:latest
          cache-from: type=gha,scope=mcp-proxy
          cache-to: type=gha,mode=max,scope=mcp-proxy

      - name: Build and push MCP Executor image
        uses: docker/build-push-action@v6
        with:
          context: docker/runtimes/mcp-executor
          file: docker/runtimes/mcp-executor/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.MCP_EXECUTOR_REPO }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.MCP_EXECUTOR_REPO }}:latest
          cache-from: type=gha,scope=mcp-executor
          cache-to: type=gha,mode=max,scope=mcp-executor

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[
              \"set -ex\",
              \"cd /opt/wooblay\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}\",
              \"sed -i 's|GATE_IMAGE=.*|GATE_IMAGE=${{ env.ECR_REGISTRY }}/${{ env.GATE_REPO }}:mvp|' .env\",
              \"sed -i 's|AGENT_IMAGE=.*|AGENT_IMAGE=${{ env.ECR_REGISTRY }}/${{ env.AGENT_REPO }}:latest|' .env\",
              \"grep -q '^MCP_PROXY_IMAGE=' .env && sed -i 's|MCP_PROXY_IMAGE=.*|MCP_PROXY_IMAGE=${{ env.ECR_REGISTRY }}/${{ env.MCP_PROXY_REPO }}:latest|' .env || echo 'MCP_PROXY_IMAGE=${{ env.ECR_REGISTRY }}/${{ env.MCP_PROXY_REPO }}:latest' >> .env\",
              \"grep -q '^OPENAI_API_KEY=' .env || echo 'OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}' >> .env\",
              \"sed -i 's|OPENAI_API_KEY=.*|OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}|' .env\",
              \"grep -q '^OPENAI_MODEL=' .env || echo 'OPENAI_MODEL=gpt-4.1-mini' >> .env\",
              \"grep -q '^VAULT_MASTER_KEY=' .env || echo 'VAULT_MASTER_KEY=${{ secrets.VAULT_MASTER_KEY }}' >> .env\",
              \"sed -i 's|VAULT_MASTER_KEY=.*|VAULT_MASTER_KEY=${{ secrets.VAULT_MASTER_KEY }}|' .env\",
              \"grep -q '^FULL_PLATFORM_UNLOCK_PASSWORD=' .env || echo 'FULL_PLATFORM_UNLOCK_PASSWORD=${{ secrets.FULL_PLATFORM_UNLOCK_PASSWORD }}' >> .env\",
              \"sed -i 's|FULL_PLATFORM_UNLOCK_PASSWORD=.*|FULL_PLATFORM_UNLOCK_PASSWORD=${{ secrets.FULL_PLATFORM_UNLOCK_PASSWORD }}|' .env\",
              \"grep -q 'env_file:' docker-compose.yml || { cp docker-compose.yml dc.bak && awk '/^    environment:/{print \\\"    env_file:\\\"; print \\\"      - .env\\\"}1' dc.bak > docker-compose.yml && rm dc.bak; }\",
              \"docker compose down || true\",
              \"docker image prune -af || true\",
              \"docker compose pull gate\",
              \"docker pull ${{ env.ECR_REGISTRY }}/${{ env.AGENT_REPO }}:latest\",
              \"docker pull ${{ env.ECR_REGISTRY }}/${{ env.MCP_PROXY_REPO }}:latest\",
              \"docker pull ${{ env.ECR_REGISTRY }}/${{ env.MCP_EXECUTOR_REPO }}:latest\",
              \"docker tag ${{ env.ECR_REGISTRY }}/${{ env.MCP_EXECUTOR_REPO }}:latest wooblay/mcp-executor:latest\",
              \"docker compose up -d --force-recreate\",
              \"sleep 30\",
              \"docker logs wooblay-gate 2>&1 | tail -30\",
              \"curl -sf http://localhost:4800/health || { echo 'Health check failed — dumping gate logs:'; docker logs wooblay-gate 2>&1 | tail -80; exit 1; }\",
              \"echo DEPLOY_SUCCESS\"
            ],\"executionTimeout\":[\"300\"]}" \
            --query "Command.CommandId" \
            --output text \
            --region "${{ env.AWS_REGION }}")

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --query "Status" \
              --output text \
              --region "${{ env.AWS_REGION }}" 2>/dev/null || echo "Pending")
            
            echo "Attempt $i: Status=$STATUS"
            
            if [ "$STATUS" = "Success" ]; then
              echo "Deploy successful!"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deploy failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ env.INSTANCE_ID }}" \
                --query "{Output:StandardOutputContent,Error:StandardErrorContent}" \
                --output json \
                --region "${{ env.AWS_REGION }}"
              exit 1
            fi
            
            sleep 10
          done

          echo "Deploy timed out waiting for SSM command"
          exit 1

      - name: Verify deployment
        run: |
          sleep 5
          # Health check through ALB
          curl -sf http://wooblay-alb-1564688078.us-east-1.elb.amazonaws.com/health || {
            echo "ALB health check failed"
            exit 1
          }
          echo "Deployment verified - ALB health check passed"
